<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearing Port Tests</title>
<style>
  body { font: 13px/1.45 ui-monospace, Consolas, monospace; margin: 16px; background: #fff; color: #111; }
  .pass { color: #0a7a2f; } .fail { color: #b3261e; font-weight: bold; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h3>pbmath.js / meshgen.js vs fixtures</h3>
<pre id="out">running…</pre>
<script type="module">
import * as pm from "./js/pbmath.js";
import { build } from "./js/engine.js";

const out = document.getElementById("out");
const lines = [];
let nPass = 0, nFail = 0;
function check(name, ok, detail = "") {
  ok ? nPass++ : nFail++;
  lines.push(`<span class="${ok ? "pass" : "fail"}">${ok ? "PASS" : "FAIL"}</span> ${name}${detail ? "  — " + detail : ""}`);
}
const maxAbs = (a, b) => a.length !== b.length ? Infinity : Math.max(...a.map((v, i) => Math.abs(v - b[i])));

async function fixture(name) {
  const fx = await (await fetch(`../fixtures/${name}`)).json();
  const p = { ...pm.DEFAULTS, ...fx.params };
  const g = pm.derive(p);
  let dmax = 0, dkey = "";
  for (const [k, v] of Object.entries(fx.derived)) {
    const e = Math.abs(g[k] - v);
    if (e > dmax) { dmax = e; dkey = k; }
  }
  check(`${name}: derived`, dmax < 1e-9, `max err ${dmax.toExponential(2)} (${dkey})`);
  const prof = pm.buildProfiles(p, g);
  for (const k of ["planet", "sun", "ring"]) {
    const er = maxAbs(prof[k].r, fx.profiles[k].r), et = maxAbs(prof[k].t, fx.profiles[k].t);
    check(`${name}: profile ${k}`, er < 1e-6 && et < 1e-6, `r ${er.toExponential(2)}, t ${et.toExponential(2)}, n=${prof[k].r.length}`);
    for (const s of ["rf", "ra", "ri", "ro"]) if (s in fx.profiles[k]) {
      const e = Math.abs(prof[k][s] - fx.profiles[k][s]);
      if (e > 1e-6) check(`${name}: profile ${k}.${s}`, false, `${prof[k][s]} vs ${fx.profiles[k][s]}`);
    }
  }
  const ph = pm.phasing(g);
  const ep = Math.max(maxAbs(ph.orbit, fx.phasing.orbit), maxAbs(ph.spins, fx.phasing.spins), Math.abs(ph.ring_rot - fx.phasing.ring_rot));
  check(`${name}: phasing`, ep < 1e-9, `max err ${ep.toExponential(2)}`);
  const { f } = pm.helixTwist(g, p.beta, p.H, p.reversals);
  let et = 0;
  for (const [z, a, b, c] of fx.twist_samples) { const v = f(z); et = Math.max(et, Math.abs(v[0] - a), Math.abs(v[1] - b), Math.abs(v[2] - c)); }
  check(`${name}: twist`, et < 1e-9, `max err ${et.toExponential(2)}`);
  const rep = pm.report(p, g, prof);
  const diff = rep.map((l, i) => [l, fx.report[i]]).filter(([a, b]) => a !== b);
  check(`${name}: report (${fx.report.length} lines)`, rep.length === fx.report.length && diff.length === 0,
    diff.map(([a, b]) => `\n   js: ${a}\n   py: ${b}`).join(""));
  if (fx.taper_sections) {
    let ex = 0, ep = 0;
    for (const sec of fx.taper_sections) {
      const dx = pm.taperDx(p, g.m, sec.z);
      const gz = pm.derive(p, null, null, null, dx);
      ex = Math.max(ex, Math.abs(dx - sec.dx), Math.abs(gz.x - sec.x));
      const pz = pm.buildProfiles(p, gz);
      for (const k of ["planet", "sun", "ring"]) ep = Math.max(ep, maxAbs(pz[k].r, sec.profiles[k].r), maxAbs(pz[k].t, sec.profiles[k].t));
    }
    check(`${name}: taper sections (${fx.taper_sections.length} heights)`, ex < 1e-12 && ep < 1e-6, `dx/x err ${ex.toExponential(2)}, profile err ${ep.toExponential(2)}`);
  }
  if (fx.spline) {
    const sp = pm.splineProfiles(p);
    const eg = Math.max(...Object.entries(fx.spline.geometry).map(([k, v]) => Math.abs(sp.g[k] - v)));
    const ep = Math.max(maxAbs(sp.bore.r, fx.spline.bore.r), maxAbs(sp.bore.t, fx.spline.bore.t),
      maxAbs(sp.shaft.r, fx.spline.shaft.r), maxAbs(sp.shaft.t, fx.spline.shaft.t));
    check(`${name}: spline geometry + profiles`, eg < 1e-9 && ep < 1e-6, `geom ${eg.toExponential(2)}, profiles ${ep.toExponential(2)}`);
  }
  if (fx.train) {
    const t = pm.trainLayout(p);
    let e = 0, bad = [];
    t.bearings.forEach((b, i) => {
      const f = fx.train.bearings[i];
      if (!f) { bad.push("extra bearing " + b.name); return; }
      for (const k of ["Ze", "hand"]) if (b[k] !== f[k]) bad.push(`${b.name}.${k} ${b[k]} vs ${f[k]}`);
      for (const k of ["Zs", "Zp", "Zr", "N"]) if (b.p[k] !== f[k]) bad.push(`${b.name}.${k} ${b.p[k]} vs ${f[k]}`);
      e = Math.max(e, Math.abs(b.cx - f.cx), Math.abs(b.cy - f.cy), Math.abs(b.rot - f.rot), Math.abs(b.p.OD - f.OD));
      const ge = pm.extGeometry(b.p);
      for (const [k, v] of Object.entries(f.ext)) e = Math.max(e, Math.abs(ge[k] - v));
    });
    if (t.bearings.length !== fx.train.bearings.length) bad.push("bearing count");
    if (JSON.stringify(t.notes) !== JSON.stringify(fx.train.notes)) bad.push("notes " + JSON.stringify(t.notes));
    check(`${name}: gear train layout (${t.bearings.length} bearings)`, !bad.length && e < 1e-9, bad.join("; ") || `max err ${e.toExponential(2)}`);
  }
  for (const sc of fx.solver) {
    const q = { ...p, ...sc.input };
    const t0 = performance.now();
    const s = pm.solve(q, sc.lock);
    const ms = (performance.now() - t0).toFixed(0);
    const ok = s.Zs === sc.out.Zs && s.Zp === sc.out.Zp && s.Zr === sc.out.Zr && s.N === sc.out.N &&
      JSON.stringify(s.notes) === JSON.stringify(sc.notes);
    check(`${name}: solve(${JSON.stringify(sc.input)}, ${sc.lock})`, ok,
      `${s.Zs}/${s.Zp}/${s.Zr} x${s.N} [${ms} ms]` + (ok ? "" : ` expected ${JSON.stringify(sc.out)} ${JSON.stringify(sc.notes)} got ${JSON.stringify(s.notes)}`));
  }
  return p;
}

function meshChecks(name, p, expect, want = null) {
  const t0 = performance.now();
  const r = build(p);
  const ms = performance.now() - t0;
  if (r.fatal) { check(`${name}: builds`, false, r.fatal.join("; ")); return null; }
  let tris = 0, bodies = 0;
  for (const c of r.checks) {
    tris += c.tris * c.count; bodies += c.count;
    const nm = `${name}: ${r.multi ? c.bearing + " " : ""}${c.name}${c.count > 1 ? " x" + c.count : ""}`;
    check(`${nm} mesh closed & oriented`, c.ok, `${c.tris} tris, ${c.badEdges} bad edges`);
    if (expect && expect[c.name] && !r.multi) {
      const e = Math.abs(c.volume / expect[c.name] - 1);
      check(`${nm} volume ${c.volume.toFixed(2)} mm³ vs FreeCAD ${expect[c.name]}`, e < 0.01, `${(e * 100).toFixed(2)} %`);
    } else check(`${nm} volume ${c.volume.toFixed(2)} mm³ > 0`, c.volume > 0);
  }
  if (want) for (const w of want) check(`${name}: has ${w}`, r.checks.some((c) => c.name === w));
  lines.push(`     total ${tris} facets (${bodies} bodies), build ${ms.toFixed(0)} ms ` +
    `(profiles ${r.ms.profiles.toFixed(0)}, mesh ${r.ms.mesh.toFixed(0)})`);
  return r;
}

try {
  const p1 = await fixture("default_profiles.json");
  const pv1 = await fixture("v1_default_profiles.json");
  const p2 = await fixture("large_hex_profiles.json");
  const p3 = await fixture("taper_susan_profiles.json");
  const pv2 = await fixture("v2_default_profiles.json");
  const pSpl = await fixture("spline_profiles.json");
  const pPin = await fixture("pins_profiles.json");
  const pWal = await fixture("walls_profiles.json");
  const pTrn = await fixture("train_profiles.json");
  window.__fx = { p1, pv1, pv2, p2, p3, pSpl, pPin, pWal, pTrn };
  if (window.__onlyFixtures) throw new Error("fixtures only");
  // V1 defaults vs the FreeCAD export (Documents/PlanetaryBearing/PlanetaryBearing_OD31.7_ID22_..._e0.15.stl, trimesh)
  meshChecks("V1 default", pv1, { ring: 532.31, sun: 354.07, planet: 12.742 });
  // V2 defaults vs the FreeCAD export of the same (build/freecad/..._S31P4x14R39_b30_e0.1.stl, trimesh)
  meshChecks("V2 default", pv2, { ring: 713.95, sun: 419.27, planet: 40.597 });
  meshChecks("V3 default", p1, null);
  meshChecks("large_hex", p2, null);
  for (const shape of ["Square", "D-Flat", "None"]) meshChecks(`default sun bore ${shape}`, { ...p1, sun_bore_shape: shape, ID: shape === "None" ? 18 : 8 }, null);
  meshChecks("no chamfer", { ...p1, chamfer: 0 }, null);
  meshChecks("spur, hex planet bores", { ...p2, beta: 0, planet_bore_shape: "Hex" }, null);
  // V2 textures (each type on the OD and in the bore) and tapers
  for (const t of pm.TEX_TYPES.slice(1)) meshChecks(`OD ${t}`, { ...p1, od_tex: t, od_tex_depth: 0.15 }, null);
  for (const t of pm.TEX_TYPES.slice(1)) meshChecks(`bore ${t}`, { ...p1, bore_tex: t }, null);
  meshChecks("hex bore + texture (ignored)", { ...p1, ID: 8, sun_bore_shape: "Hex", bore_tex: "Dimples" }, null);
  const tp = { ...p1, OD: 60, ID: 30, H: 8, Zp: 10, Zs: 60, Zr: 80, N: 14, taper: 4 };
  for (const [nm, o] of [["single", {}], ["single flip", { taper_flip: true }], ["mirror", { taper_mirror: true }], ["mirror flip", { taper_mirror: true, taper_flip: true }]])
    meshChecks(`taper 4° ${nm}`, { ...tp, ...o }, null);
  meshChecks("lazy susan (taper + knurl + ovals)", p3, null);
  // V3
  meshChecks("spline bore + shaft", pSpl, null, ["shaft"]);
  meshChecks("planet pins + carrier", pPin, null, ["pin", "carrier"]);
  meshChecks("fit walls", pWal, null);
  const rt = meshChecks("gear train A-B-C (herringbone outer teeth)", pTrn, null);
  if (rt) check("gear train: 3 bearings", rt.bearings.length === 3 && rt.multi);
  meshChecks("gear train, helical, A-B", { ...pTrn, train: "A-B", ext_helix: "Helical" }, null);
  meshChecks("outer teeth straight, single", { ...pTrn, train: "Single", ext_helix: "Straight" }, null);
  meshChecks("OD raised ovals", { ...p1, od_tex: "Raised ovals", od_tex_depth: 0.15 }, null);
  meshChecks("bore raised ovals", { ...p1, bore_tex: "Raised ovals" }, null);
  meshChecks("separate chamfers", { ...p1, chamfer: 0.2, planet_chamfer: 0.1, ring_od_chamfer: 0.6, sun_bore_chamfer: 0.8 }, null);
  meshChecks("pins + taper + train", { ...pTrn, train: "A-B", planet_pins: true, pin_d: 1.6, OD: 60, ID: 20 }, null);
  meshChecks("taper + diamond OD + planet bores", { ...tp, taper_mirror: true, od_tex: "Diamond knurl", planet_bore_d: 2 }, null);
} catch (e) {
  check("exception", false, String(e.stack || e));
}
lines.unshift(`${nFail ? '<span class="fail">' : '<span class="pass">'}${nPass} passed, ${nFail} failed</span>\n`);
out.innerHTML = lines.join("\n");
window.__testResult = { pass: nPass, fail: nFail, text: out.textContent };
</script>
</body>
</html>
